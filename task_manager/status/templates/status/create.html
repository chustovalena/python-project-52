{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container mt-4">
    <h1>{% translate 'Create a status' %}</h1>

    <form method="post">
    {% csrf_token %}

    {% for field in form %}
    <div class="mb-3">

      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}

      {% if field.help_text %}
        <div class="form-text text-muted" style="font-size: 0.875em;">
          {{ field.help_text|safe }}
        </div>
      {% endif %}

      {% if field.errors %}
        <div class="text-danger" style="font-size: 0.9em;">
          {{ field.errors }}
        </div>
      {% endif %}

    </div>
    {% endfor %}

        <button class="btn btn-primary" type="submit">{% translate 'Create' %}</button>
    </form>
</div>
{% endblock %}
