{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container mt-4">
    <h1>{% translate 'Create a status' %}</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <div class="mb-3">
            {{ form.name.label_tag }}
            {{ form.name }}
            {{ form.name.errors }}
        </div>

        <button class="btn btn-primary" type="submit">{% translate 'Create' %}</button>
    </form>
</div>
{% endblock %}
