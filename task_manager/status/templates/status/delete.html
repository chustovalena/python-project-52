{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container mt-4">
    <h1 class="my-4">{% translate 'Delete the status' %}</h1>
    <p>{% translate 'Are you sure you want to delete the status' %} <b>{{ object.name }}</b>?</p>

    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">{% translate 'Yes, delete the status' %}</button>
    </form>
</div>
{% endblock %}
