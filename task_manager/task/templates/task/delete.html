{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container mt-4">
    <h1>{% translate 'Delete the task' %}</h1>
    <p>{% translate 'Are you sure you want to delete the task' %}: <b>{{ object.name }}</b>?</p>

    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">{% translate 'Yes, delete the task' %}</button>
    </form>
</div>
{% endblock %}
