{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">{% translate 'Login' %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}">
            {{ field.label }}
            </label>

            {{ field }}

            {% if field.errors %}
            <div class="text-danger">
                {{ field.errors }}
            </div>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary">{% translate 'Log in' %}</button>
    </form>
</div>
{% endblock content %}
