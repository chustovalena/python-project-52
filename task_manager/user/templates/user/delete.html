{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Удалить пользователя</h1>
    <p>Вы уверены, что хотите удалить пользователя: <b>{{ object.username }}</b>?</p>

    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Да, удалить</button>
        <a class="btn btn-secondary" href="{% url 'users:index' %}">Отмена</a>
    </form>
</div>
{% endblock %}
